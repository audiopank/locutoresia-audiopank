<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amostras de Voz — Locutores IA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --primary:#6366f1; --card:#1e293b; --bg:#0f172a; --border:#334155;
                --txt:#f1f5f9; --txt2:#94a3b8; }
        body { background: var(--bg); color: var(--txt); font-family:'Segoe UI',sans-serif; }
        .caixa { background: var(--card); border:1px solid var(--border); border-radius:14px; padding:22px; }
        .form-control, .form-select { background:#0e1424; border:1px solid var(--border); color:var(--txt); }
        .form-control:focus, .form-select:focus { background:#0e1424; color:var(--txt); border-color:var(--primary); box-shadow:none; }
        .demo-linha { background:#0e1424; border:1px solid var(--border); border-radius:10px;
                      padding:.7rem .9rem; margin-bottom:.6rem; display:flex; gap:12px;
                      align-items:center; flex-wrap:wrap; }
        .demo-linha audio { height:34px; max-width:230px; }
        a { color:#c4b5fd; }
    </style>
</head>
<body>
<div class="container py-4" style="max-width:920px;">

    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <div>
            <h3 class="mb-0"><i class="fas fa-headphones me-2"></i>Amostras de Voz</h3>
            <small class="text-secondary">
                Peças finalizadas que o cliente ouve na vitrine antes de pedir.
            </small>
        </div>
        <a href="/" class="btn btn-outline-light btn-sm"><i class="fas fa-arrow-left me-1"></i>Voltar ao estúdio</a>
    </div>

    <div class="caixa mb-4">
        <h6 class="mb-3">Publicar uma amostra</h6>
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label">Arquivo de áudio *</label>
                <input type="file" class="form-control" id="arquivo" accept="audio/*">
                <small class="text-secondary">Use uma peça pronta e mixada — é o seu cartão de visita.</small>
            </div>
            <div class="col-md-6">
                <label class="form-label">Categoria *</label>
                <select class="form-select" id="categoria">
                    <option value="institucional">Institucional padrão</option>
                    <option value="varejo">Varejo animado</option>
                    <option value="jovem">Jovem — festas e promoções</option>
                    <option value="nordeste">Sotaque nordestino</option>
                    <option value="outro">Outros estilos</option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">Nome da amostra *</label>
                <input type="text" class="form-control" id="nome" maxlength="120"
                       placeholder="Ex: Voz masculina grave">
            </div>
            <div class="col-md-6">
                <label class="form-label">Descrição curta</label>
                <input type="text" class="form-control" id="descricao" maxlength="300"
                       placeholder="Ex: firme e confiável, boa pra clínica">
            </div>
            <div class="col-12">
                <button class="btn btn-primary" id="btnPublicar" onclick="publicar()">
                    <i class="fas fa-upload me-1"></i>Publicar amostra
                </button>
                <span id="status" class="ms-2 small"></span>
            </div>
        </div>
    </div>

    <div class="caixa">
        <h6 class="mb-3">Amostras publicadas <span class="text-secondary" id="contador"></span></h6>
        <div id="lista"><p class="text-secondary small mb-0">Carregando...</p></div>
    </div>
</div>

<script>
    function esc(s) {
        return String(s == null ? '' : s)
            .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
            .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    async function carregar() {
        const alvo = document.getElementById('lista');
        try {
            const d = await (await fetch('/api/voice-demos')).json();
            const cats = d.categorias || [];
            document.getElementById('contador').textContent = `(${d.total || 0})`;
            if (!cats.length) {
                alvo.innerHTML = '<p class="text-secondary small mb-0">Nenhuma amostra ainda. ' +
                    'Enquanto não houver, o modal da vitrine manda o cliente direto pro formulário.</p>';
                return;
            }
            alvo.innerHTML = cats.map(c => `
                <div class="mb-3">
                    <div class="fw-bold mb-2">${esc(c.nome)}</div>
                    ${c.demos.map(dm => `
                        <div class="demo-linha">
                            <div class="flex-grow-1" style="min-width:160px;">
                                <div>${esc(dm.nome)}</div>
                                <small class="text-secondary">${esc(dm.descricao || '')}</small>
                            </div>
                            <audio controls preload="none" src="${esc(dm.audio_url)}"></audio>
                            <button class="btn btn-outline-danger btn-sm"
                                    onclick="remover('${esc(dm.id)}')">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>`).join('')}
                </div>`).join('');
        } catch (e) {
            alvo.innerHTML = '<p class="text-danger small mb-0">Erro ao carregar: ' + esc(e.message) + '</p>';
        }
    }

    async function publicar() {
        const arq = document.getElementById('arquivo').files[0];
        const nome = document.getElementById('nome').value.trim();
        const status = document.getElementById('status');
        const btn = document.getElementById('btnPublicar');

        if (!arq)  { status.className = 'ms-2 small text-danger'; status.textContent = 'Escolha o arquivo de áudio.'; return; }
        if (!nome) { status.className = 'ms-2 small text-danger'; status.textContent = 'Dê um nome à amostra.'; return; }

        btn.disabled = true;
        status.className = 'ms-2 small text-info';
        try {
            // Sobe DIRETO pro Storage (signed URL) — o corpo da função no Vercel
            // não aguenta arquivo grande. Mesmo caminho das trilhas.
            status.textContent = 'Enviando o áudio...';
            const ru = await fetch('/api/tracks/upload-url', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ filename: arq.name })
            });
            const u = await ru.json();
            if (!u.success) throw new Error(u.error || 'Falha ao preparar o envio');

            const fd = new FormData();
            fd.append('file', arq, arq.name);
            const up = await fetch(u.upload_url, {
                method: 'PUT',
                headers: { 'apikey': u.apikey, 'Authorization': 'Bearer ' + u.apikey },
                body: fd
            });
            if (!up.ok) throw new Error('Falha ao enviar o áudio');

            status.textContent = 'Publicando...';
            const r = await fetch('/api/voice-demos', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    file_url: u.public_url,
                    nome: nome,
                    categoria: document.getElementById('categoria').value,
                    descricao: document.getElementById('descricao').value.trim(),
                    file_size: arq.size,
                    mime_type: arq.type || 'audio/mpeg'
                })
            });
            const d = await r.json();
            if (!d.success) throw new Error(d.error || 'Falha ao publicar');

            status.className = 'ms-2 small text-success';
            status.textContent = '✅ Publicada! Já aparece na vitrine.';
            document.getElementById('arquivo').value = '';
            document.getElementById('nome').value = '';
            document.getElementById('descricao').value = '';
            carregar();
        } catch (e) {
            status.className = 'ms-2 small text-danger';
            status.textContent = '❌ ' + e.message;
        } finally {
            btn.disabled = false;
        }
    }

    async function remover(id) {
        if (!confirm('Tirar esta amostra da vitrine?')) return;
        try {
            const r = await fetch('/api/tracks/' + id, { method: 'DELETE' });
            const d = await r.json();
            if (!d.success) throw new Error(d.error || 'Falha ao remover');
            carregar();
        } catch (e) { alert('Erro: ' + e.message); }
    }

    carregar();
</script>
</body>
</html>
